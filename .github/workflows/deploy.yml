name: Deploy Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: https://coolify.philippeho.dev
          COOLIFY_RESOURCE_UUID: vm871iggnjyzcufbzyvxbssq
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          missing=0
          for name in COOLIFY_URL COOLIFY_RESOURCE_UUID COOLIFY_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing ${name}. Configure it in GitHub repository/organization secrets or variables."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          curl --fail --silent --show-error --request GET \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_RESOURCE_UUID}&force=true" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json"
